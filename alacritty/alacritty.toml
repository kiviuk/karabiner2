import = [
    # "~/.config/alacritty/themes/themes/coolnight.toml"
    "~/.config/alacritty/coolnight-theme/coolnight.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 0
option_as_alt = "Both"

# decorations = "Buttonless"

opacity = 0.8
blur = true

[font]
normal.family = "MesloLGS Nerd Font Mono"
# regular
size = 17

[selection]
# Default semantic_escape_chars minus the forward slash '/'
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

  #for video
# size = 35.0

# coolnight theme to the themes folder
# curl https://raw.githubusercontent.com/josean-dev/dev-environment-files/main/.config/alacritty/themes/themes/coolnight.toml --output ~/.config/alacritty/themes/themes/coolnight.toml

[keyboard]
bindings = [
  { key = "Return", mods = "Command", chars = "\u000a" },
  { key = "Space", mods = "Control", chars = "\u0000" },
  # Font size control (bypasses tmux)
  { key = "Equals", mods = "Control", mode = "~Vi|~Search", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", mode = "~Vi|~Search", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", mode = "~Vi|~Search", action = "ResetFontSize" },
]

